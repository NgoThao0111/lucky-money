<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lì xì đầu năm</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="images/coin.png" type="image/png">
</head>
<body>
    <div class="container">
        <div class="top">
            <img src="images/curtain.png" alt="curtain-up" class="curtain-up"/>
            <img src="images/flower lantern.png" alt="flower-lantern-left" class="flower-lantern-left"/>
            <img src="images/flower lantern.png" alt="flower-lantern-right" class="flower-lantern-right"/>
        </div>
        <div class="content">
            <div class="select-container">
                <h1 class="title"> Chọn lì xì </h1> 
                <div class="envelopes-grid">
                    <img src="images/envelope.png" alt="envelope-1" class="envelope" id="envelope-1"/>
                    <img src="images/envelope.png" alt="envelope-2" class="envelope" id="envelope-2"/>
                    <img src="images/envelope.png" alt="envelope-3" class="envelope" id="envelope-3"/>
                    <img src="images/envelope.png" alt="envelope-4" class="envelope" id="envelope-4"/>
                    <img src="images/envelope.png" alt="envelope-5" class="envelope" id="envelope-5"/>
                    <img src="images/envelope.png" alt="envelope-6" class="envelope" id="envelope-6"/>
                </div>
                <div class="button-container">
                    <img src="images/button.png" alt="confirm-button" class="button" id="confirm-button"/>
                    Xác nhận
                </div>
            </div>
            <div class="result-container">
                <h1 class="title"> Chúc mừng </h1> 
                <div class="result-image">
                </div>
                <div class="button-container">
                    <img src="images/button.png" alt="return-button" class="button" id="return-button"/>
                    Quay lại
                </div>
            </div>
        </div>
        <div class="bottom">
            <img src="images/curtain.png" alt="curtain-down" class="curtain-down"/>
            <img src="images/money.png" alt="money" class="money"/>
            <img src="images/fan.png" alt="fan" class="fan"/>
        </div>
    </div>
</body>
</html>
